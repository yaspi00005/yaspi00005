# Base MySQL pour le développement local : « docker compose up -d »
services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sotrama
      MYSQL_USER: sotrama
      MYSQL_PASSWORD: changer_moi
      MYSQL_ROOT_PASSWORD: changer_moi_root
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data:
