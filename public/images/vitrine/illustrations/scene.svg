  <path d="M0 392 C 260 380, 520 386, 840 380" fill="none" stroke="#5c5346" stroke-width="30" stroke-linecap="round"/>
  <path d="M0 392 C 260 380, 520 386, 840 380" fill="none" stroke="#f3e9cf" stroke-width="3" stroke-dasharray="26 22"/>

