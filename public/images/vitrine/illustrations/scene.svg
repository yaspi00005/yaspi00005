<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-label="Camion SOTRAMA, porte-conteneurs et avion en route vers l'Afrique">
  <defs>
    <linearGradient id="mer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa7a0"/>
      <stop offset="1" stop-color="#1f7a74"/>
    </linearGradient>
    <linearGradient id="colline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c79a"/>
      <stop offset="1" stop-color="#c9b27c"/>
    </linearGradient>
    <linearGradient id="colline2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc58a"/>
      <stop offset="1" stop-color="#7fb06d"/>
