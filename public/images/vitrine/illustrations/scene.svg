    <g stroke-width="3">
      <rect x="30" y="42" width="62" height="28" fill="#1c9a44"/><rect x="92" y="42" width="62" height="28" fill="#ffd23f"/>
      <rect x="154" y="42" width="62" height="28" fill="#d7263d"/><rect x="216" y="42" width="62" height="28" fill="#1c9a44"/>
      <rect x="278" y="42" width="62" height="28" fill="#e8a33d"/>
      <rect x="60" y="14" width="62" height="28" fill="#d7263d"/><rect x="122" y="14" width="62" height="28" fill="#1c9a44"/>
      <rect x="184" y="14" width="62" height="28" fill="#ffd23f"/><rect x="246" y="14" width="62" height="28" fill="#3fa7a0"/>
      <rect x="150" y="-14" width="62" height="28" fill="#ffd23f"/><rect x="212" y="-14" width="62" height="28" fill="#d7263d"/>
    </g>
    <g stroke-width="2" opacity=".35">
      <path d="M44 46v20M58 46v20M72 46v20M106 46v20M120 46v20M134 46v20M168 46v20M182 46v20M196 46v20M230 46v20M244 46v20M258 46v20M292 46v20M306 46v20M320 46v20"/>
      <path d="M74 18v20M88 18v20M102 18v20M136 18v20M150 18v20M164 18v20M198 18v20M212 18v20M226 18v20M260 18v20M274 18v20M288 18v20M164 -10v20M178 -10v20M192 -10v20M226 -10v20M240 -10v20M254 -10v20"/>
    </g>
  </g>
