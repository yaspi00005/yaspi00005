  </defs>

  <!-- Soleil et nuages -->
  <circle cx="1010" cy="120" r="70" fill="#ffd23f" opacity=".55"/>
  <circle cx="1010" cy="120" r="48" fill="#ffd23f" opacity=".9"/>
  <g fill="#fff" opacity=".9">
