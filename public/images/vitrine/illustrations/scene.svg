    <path d="M-50 -10l-16-26h14l24 26z" fill="#0b7a3b" stroke="#102419" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-6 6l-26 34h16l40-34z" fill="#e6ecef" stroke="#102419" stroke-width="3" stroke-linejoin="round"/>
