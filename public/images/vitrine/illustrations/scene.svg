    <ellipse cx="62" cy="-14" rx="34" ry="18" fill="#b0763a"/>
    <path d="M40 -22c10 6 34 6 44 0M40 -10c10 6 34 6 44 0" fill="none" stroke-width="2.5"/>
    <ellipse cx="104" cy="-10" rx="26" ry="15" fill="#c68c4d"/>
    <rect x="18" y="0" width="120" height="26" rx="4" fill="#ffd23f"/>
    <rect x="120" y="-18" width="26" height="30" rx="3" fill="#d7263d"/>
    <path d="M40 8h70M40 17h70" stroke-width="2.5"/>
    <!-- carrosserie -->
    <path d="M10 26h150v70H10z" fill="#1c9a44"/>
    <path d="M160 40h34c10 0 18 6 22 16l12 28v12h-68z" fill="#1c9a44"/>
    <path d="M168 48h24c6 0 10 3 12 8l8 18h-44z" fill="#bfe6f2"/>
    <rect x="28" y="46" width="104" height="30" rx="6" fill="#0b7a3b"/>
    <text x="80" y="68" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-weight="800" font-size="19" fill="#ffd23f" stroke="none">sotrama</text>
    <rect x="212" y="80" width="18" height="10" rx="3" fill="#ffd23f"/>
    <!-- roues -->
    <circle cx="52" cy="100" r="19" fill="#26312b"/><circle cx="52" cy="100" r="7" fill="#c9c2b0"/>
    <circle cx="190" cy="100" r="19" fill="#26312b"/><circle cx="190" cy="100" r="7" fill="#c9c2b0"/>
