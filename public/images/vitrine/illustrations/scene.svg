    <path d="M1300 70c0-14 11-25 25-25 10 0 18 5 22 13 3-1 6-2 10-2 12 0 22 10 22 22h-79z"/>
    <path d="M620 150c0-12 10-22 22-22 8 0 15 4 19 11 2-1 5-1 8-1 11 0 19 8 19 19h-68z" opacity=".8"/>
  </g>

  <!-- Avion et trajectoire -->
  <path d="M430 250 C 620 120, 860 60, 1180 90" fill="none" stroke="#0b7a3b" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round" opacity=".55"/>
  <g transform="translate(1185 88) rotate(6)">
