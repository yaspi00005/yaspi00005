  <path d="M900 300h120v14H900z" fill="#8a7f6a"/><path d="M910 314v40M1000 314v40" stroke="#6b6254" stroke-width="6"/>
  <g stroke="#d7263d" stroke-width="7" stroke-linecap="square" fill="none">
