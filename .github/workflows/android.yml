# Compile l'application Android SOTRAMA (Trusted Web Activity). Le fichier sotrama.apk est à
# télécharger dans « Artifacts » en bas de l'exécution, puis à déposer sur le serveur dans apk/
# (le site l'héberge lui-même : page /application).
#
# Réglages (Settings → Secrets and variables → Actions) :
#   - variable  SOTRAMA_URL            adresse HTTPS du site, ex. https://app.sotrama.com
#   - secret    ANDROID_KEYSTORE_BASE64   clé de signature (fichier .jks encodé en base64)
#   - secret    ANDROID_KEYSTORE_PASSWORD mot de passe de la clé
# Lancement : onglet Actions → « Application Android » → Run workflow.
name: Application Android

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Adresse HTTPS du site (laisser vide pour utiliser la variable SOTRAMA_URL)"
        required: false
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SOTRAMA_URL: ${{ inputs.url || vars.SOTRAMA_URL || 'https://sotrama.example.com' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clé de signature
        id: cle
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PWD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sotrama.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/sotrama.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PWD" >> "$GITHUB_ENV"
            echo "signee=oui" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Clé de signature absente : APK de test signé avec une clé de débogage (ne pas distribuer)."
            echo "signee=non" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Préparation de l'APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk sotrama.apk
          echo "Site : $SOTRAMA_URL — version $VERSION_NAME"
          ls -la sotrama.apk

      # Vérifie que l'APK est installable (signature valide) et affiche l'empreinte de la clé :
      # elle doit être identique à APP_ANDROID_SHA256 sur le serveur.
      - name: Vérification de la signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --verbose --print-certs sotrama.apk | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)|WARNING" || true
          "$APKSIGNER" verify sotrama.apk

      # À télécharger en bas de la page de l'exécution (« Artifacts ») puis à déposer
      # sur le serveur dans le dossier apk/ du projet (voir apk/LISEZMOI.txt).
      - uses: actions/upload-artifact@v4
        with:
          name: sotrama-apk-1.${{ github.run_number }}
          path: sotrama.apk
          retention-days: 30
