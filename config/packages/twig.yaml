twig:
    file_name_pattern: '*.twig'
    form_themes: ['bootstrap_5_layout.html.twig', 'form/theme.html.twig']
    date:
        format: 'd/m/Y H:i'
        timezone: 'Europe/Paris'
    globals:
        app_nom: '%app.nom%'
        app_devise: '%app.devise%'
        app_telephone_agence: '%app.telephone_agence%'
        push_cle_publique: '%env(VAPID_PUBLIC_KEY)%'

when@test:
    twig:
        strict_variables: true
