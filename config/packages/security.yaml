security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|theme|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_accueil
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true              # déconnexion uniquement depuis le lien de l'application
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800               # 7 jours
                path: /
                secure: auto                   # cookie envoyé uniquement en HTTPS (en production)
                httponly: true
                samesite: lax
                # Le cookie « rester connecté » devient invalide si le mot de passe change ou si le compte est désactivé.
                signature_properties: [password, actif]

    role_hierarchy:
        ROLE_ADMIN: [ROLE_RAMASSAGE, ROLE_REPRESENTANT, ROLE_USER]
        ROLE_RAMASSAGE: [ROLE_USER]
        ROLE_REPRESENTANT: [ROLE_USER]

    access_control:
        - { route: '^vitrine_', roles: PUBLIC_ACCESS }   # site vitrine (sotrama.net)
        - { path: ^/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/suivi, roles: PUBLIC_ACCESS }
        - { path: ^/application, roles: PUBLIC_ACCESS }
        - { path: ^/\.well-known, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/ramassage, roles: ROLE_RAMASSAGE }
        - { path: ^/agence, roles: ROLE_REPRESENTANT }
        - { path: ^/expeditions, roles: ROLE_REPRESENTANT }   # admin compris (hiérarchie), pas les agents de ramassage
        - { path: ^/paiements, roles: ROLE_REPRESENTANT }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
